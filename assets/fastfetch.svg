  </text>

  <!-- Bottom terminal -->
  <text x="35" y="395"
        fill="#FF6B00"
        font-family="monospace"
        font-size="16">
    dinesh@github ~ $
  </text>

  <!-- Blinking cursor -->
  <rect x="220" y="380" width="10" height="20" fill="#FF6B00">
    <animate
      attributeName="opacity"
      values="1;0;1"
      dur="1s"
      repeatCount="indefinite"/>
  </rect>

