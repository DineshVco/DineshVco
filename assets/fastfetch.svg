<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500">

  <rect width="1100" height="500" rx="16" fill="#09090B"/>

  <!-- Terminal buttons -->
  <circle cx="28" cy="25" r="6" fill="#FF5F56"/>
  <circle cx="50" cy="25" r="6" fill="#FFBD2E"/>
  <circle cx="72" cy="25" r="6" fill="#27C93F"/>

  <text x="95" y="30"
        fill="#71717A"
        font-family="monospace"
        font-size="14">dinesh@github</text>

  <!-- Command -->
  <text x="28" y="70"
        fill="#FF6B00"
        font-family="monospace"
        font-size="17">
    dinesh@github ~ $ fastfetch
  </text>

  <!-- Profile header -->
  <g font-family="monospace" font-size="15">

    <text x="28" y="115" fill="#FF6B00">
      dinesh@github
      <animate attributeName="opacity"
               values="0;0;1"
               dur="0.5s"
               begin="1.5s"
               fill="freeze"/>
    </text>

    <text x="28" y="140" fill="#71717A">
      ----------------
      <animate attributeName="opacity"
               values="0;0;1"
               dur="0.5s"
               begin="1.8s"
               fill="freeze"/>
    </text>

    <!-- Name -->
    <text x="28" y="170">
      <tspan fill="#FF6B00">Name        :</tspan>
      <tspan fill="#F4F4F5"> Dinesh Kumar</tspan>
      <animate attributeName="opacity"
               values="0;0;1"
               dur="0.4s"
               begin="2.1s"
               fill="freeze"/>
    </text>

    <!-- Alias -->
    <text x="28" y="195">
      <tspan fill="#FF6B00">Alias       :</tspan>
      <tspan fill="#F4F4F5"> Nash</tspan>
      <animate attributeName="opacity"
               values="0;0;1"
               dur="0.4s"
               begin="2.35s"
               fill="freeze"/>
    </text>

    <!-- University -->
    <text x="28" y="220">
      <tspan fill="#FF6B00">University  :</tspan>
      <tspan fill="#F4F4F5"> Management and Science University (MSU)</tspan>
      <animate attributeName="opacity"
               values="0;0;1"
               dur="0.4s"
               begin="2.6s"
               fill="freeze"/>
    </text>

    <!-- Program -->
    <text x="28" y="245">
      <tspan fill="#FF6B00">Program     :</tspan>
      <tspan fill="#F4F4F5"> Computer Science</tspan>
      <animate attributeName="opacity"
               values="0;0;1"
               dur="0.4s"
               begin="2.85s"
               fill="freeze"/>
    </text>

    <!-- Role -->
    <text x="28" y="270">
      <tspan fill="#FF6B00">Role        :</tspan>
      <tspan fill="#F4F4F5"> Software Developer</tspan>
      <animate attributeName="opacity"
               values="0;0;1"
               dur="0.4s"
               begin="3.1s"
               fill="freeze"/>
    </text>

    <!-- Languages -->
    <text x="28" y="295">
      <tspan fill="#FF6B00">Languages   :</tspan>
      <tspan fill="#F4F4F5"> Java • Python • JavaScript • PHP</tspan>
      <animate attributeName="opacity"
               values="0;0;1"
               dur="0.4s"
               begin="3.35s"
               fill="freeze"/>
    </text>

    <!-- Web -->
    <text x="28" y="320">
      <tspan fill="#FF6B00">Web         :</tspan>
      <tspan fill="#F4F4F5"> Next.js • Tailwind • WordPress</tspan>
      <animate attributeName="opacity"
               values="0;0;1"
               dur="0.4s"
               begin="3.6s"
               fill="freeze"/>
    </text>

    <!-- Database -->
    <text x="28" y="345">
      <tspan fill="#FF6B00">Database    :</tspan>
      <tspan fill="#F4F4F5"> MySQL • SQL</tspan>
      <animate attributeName="opacity"
               values="0;0;1"
               dur="0.4s"
               begin="3.85s"
               fill="freeze"/>
    </text>

    <!-- Focus -->
    <text x="28" y="370">
      <tspan fill="#FF6B00">Focus       :</tspan>
      <tspan fill="#F4F4F5"> AI • Web Development • Software Engineering</tspan>
      <animate attributeName="opacity"
               values="0;0;1"
               dur="0.4s"
               begin="4.1s"
               fill="freeze"/>
    </text>

    <!-- Projects -->
    <text x="28" y="395">
      <tspan fill="#FF6B00">Projects    :</tspan>
      <tspan fill="#F4F4F5"> Voyage Vibe (Travel Management System)</tspan>
      <animate attributeName="opacity"
               values="0;0;1"
               dur="0.4s"
               begin="4.35s"
               fill="freeze"/>
    </text>

    <!-- Tools -->
    <text x="28" y="420">
      <tspan fill="#FF6B00">Tools       :</tspan>
      <tspan fill="#F4F4F5"> Git • VS Code • Figma • NetBeans</tspan>
      <animate attributeName="opacity"
               values="0;0;1"
               dur="0.4s"
               begin="4.6s"
               fill="freeze"/>
    </text>

    <!-- Interests -->
    <text x="28" y="445">
      <tspan fill="#FF6B00">Interests   :</tspan>
      <tspan fill="#F4F4F5"> Gym • Tech • Travel</tspan>
      <animate attributeName="opacity"
               values="0;0;1"
               dur="0.4s"
               begin="4.85s"
               fill="freeze"/>
    </text>

    <!-- Motto -->
    <text x="28" y="470">
      <tspan fill="#FF6B00">Motto       :</tspan>
      <tspan fill="#F4F4F5"> Build. Learn. Improve. Repeat.</tspan>
      <animate attributeName="opacity"
               values="0;0;1"
               dur="0.4s"
               begin="5.1s"
               fill="freeze"/>
    </text>

  </g>

  <!-- Blinking cursor -->
  <rect x="28" y="485" width="9" height="12" fill="#FF6B00">
    <animate attributeName="opacity"
             values="1;0;1"
             dur="1s"
             repeatCount="indefinite"/>
  </rect>

</svg>
