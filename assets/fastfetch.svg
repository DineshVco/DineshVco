
<svg width="1000" height="430" viewBox="0 0 1000 430" xmlns="http://www.w3.org/2000/svg">

  <rect width="1000" height="430" rx="18" fill="#09090B"/>

  <!-- Terminal header -->
  <circle cx="28" cy="25" r="7" fill="#FF6B00"/>
  <circle cx="52" cy="25" r="7" fill="#FF8A00"/>
  <circle cx="76" cy="25" r="7" fill="#FFB000"/>

  <text x="105" y="31"
        fill="#71717A"
        font-family="monospace"
        font-size="15">
    dinesh@github
  </text>

  <!-- Command -->
  <text x="35" y="70"
        fill="#FF6B00"
        font-family="monospace"
        font-size="17">
    dinesh@github ~ $ fastfetch
  </text>

  <!-- D logo -->
  <text x="55" y="215"
