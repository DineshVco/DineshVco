    -------------------------------
  </text>

  <text x="300" y="175"
        fill="#F4F4F5"
        font-family="monospace"
        font-size="15">
    Name        : Dinesh Kumar
  </text>

  <text x="300" y="200"
        fill="#F4F4F5"
        font-family="monospace"
        font-size="15">
    Alias       : Nash
  </text>

  <text x="300" y="225"
        fill="#F4F4F5"
        font-family="monospace"
        font-size="15">
    University  : MSU
  </text>

  <text x="300" y="250"
        fill="#F4F4F5"
        font-family="monospace"
        font-size="15">
