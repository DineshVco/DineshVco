    <!-- Motto -->
    <text x="28" y="470">
      <tspan fill="#FF6B00">Motto       :</tspan>
      <tspan fill="#F4F4F5"> Build. Learn. Improve. Repeat.</tspan>
      <animate
        attributeName="opacity"
        values="0;0;1;1;0"
        keyTimes="0;0.70;0.80;0.85;1"
        dur="8s"
        repeatCount="indefinite"/>
    </text>

  </g>

  <!-- Blinking cursor -->
  <rect x="28" y="485" width="9" height="12" fill="#FF6B00">
    <animate
      attributeName="opacity"
      values="1;0;1"
      dur="0.9s"
      repeatCount="indefinite"/>
  </rect>

