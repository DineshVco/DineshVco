        dur="8s"
        repeatCount="indefinite"/>
    </text>

    <!-- Program -->
    <text x="28" y="245">
      <tspan fill="#FF6B00">Program     :</tspan>
      <tspan fill="#F4F4F5"> Computer Science</tspan>
      <animate
