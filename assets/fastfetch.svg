  </text>

  <text x="300" y="275"
        fill="#F4F4F5"
        font-family="monospace"
        font-size="15">
    Role        : Software Developer
  </text>

  <text x="300" y="300"
        fill="#F4F4F5"
        font-family="monospace"
        font-size="15">
    Languages   : Java • Python • PHP
  </text>

  <text x="300" y="325"
        fill="#F4F4F5"
        font-family="monospace"
        font-size="15">
    Web         : Next.js • Tailwind
  </text>

  <text x="300" y="350"
        fill="#F4F4F5"
        font-family="monospace"
        font-size="15">
