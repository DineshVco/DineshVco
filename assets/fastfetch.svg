        dur="8s"
        repeatCount="indefinite"/>
    </text>

    <!-- Interests -->
    <text x="28" y="445">
      <tspan fill="#FF6B00">Interests   :</tspan>
      <tspan fill="#F4F4F5"> Gym • Tech • Travel</tspan>
      <animate
        attributeName="opacity"
        values="0;0;1;1;0"
        keyTimes="0;0.66;0.76;0.85;1"
        dur="8s"
        repeatCount="indefinite"/>
