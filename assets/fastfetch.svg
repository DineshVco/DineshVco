<svg xmlns="http://www.w3.org/2000/svg"
     width="1100"
     height="500"
     viewBox="0 0 1100 500">

  <rect width="1100" height="500" rx="16" fill="#09090B"/>

  <!-- Terminal buttons -->
  <circle cx="28" cy="25" r="6" fill="#FF5F56"/>
  <circle cx="50" cy="25" r="6" fill="#FFBD2E"/>
  <circle cx="72" cy="25" r="6" fill="#27C93F"/>

  <text x="95" y="30"
        fill="#71717A"
        font-family="monospace"
        font-size="14">dinesh@github</text>

  <!-- Fastfetch command -->
  <text x="28" y="70"
        fill="#FF6B00"
        font-family="monospace"
        font-size="17">
    dinesh@github ~ $ fastfetch
  </text>

  <!-- Header -->
  <g font-family="monospace" font-size="15">

    <text x="28" y="115" fill="#FF6B00">
      dinesh@github
      <animate
        attributeName="opacity"
        values="0;0;1;1;0"
        keyTimes="0;0.15;0.25;0.85;1"
        dur="8s"
        repeatCount="indefinite"/>
    </text>

    <text x="28" y="140" fill="#71717A">
      ----------------
      <animate
        attributeName="opacity"
        values="0;0;1;1;0"
        keyTimes="0;0.18;0.28;0.85;1"
        dur="8s"
        repeatCount="indefinite"/>
    </text>

    <!-- Name -->
    <text x="28" y="170">
      <tspan fill="#FF6B00">Name        :</tspan>
      <tspan fill="#F4F4F5"> Dinesh Kumar</tspan>
      <animate
        attributeName="opacity"
        values="0;0;1;1;0"
        keyTimes="0;0.22;0.32;0.85;1"
        dur="8s"
        repeatCount="indefinite"/>
    </text>

    <!-- Alias -->
    <text x="28" y="195">
      <tspan fill="#FF6B00">Alias       :</tspan>
      <tspan fill="#F4F4F5"> Nash</tspan>
